# New-API Docker Compose Configuration - Production
# Domain: https://ownapi.dev
# Database: PostgreSQL
#
# Quick Start:
#   1. docker-compose up -d
#   2. Access at https://ownapi.dev
#

version: '3.4'

services:
  new-api:
    image: ownapi/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:7Ca0eeypsemSIFKYchpK@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:tzTLoNHo3NGmstWtu4b5@redis:6379
      - TZ=Asia/Tokyo
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
      - STREAMING_TIMEOUT=300
      - SESSION_SECRET=kGxUifAI+7vOoN8tWoMtqlsA0W65+HpoP8WRqGeaX3D4Mh4Sy3IbkN3wRPo6VKh+
      - CRYPTO_SECRET=a3I3CISuljRzuu+kcklYd1uCfpg7rl29IAW+FzBJYC0=
      - FRONTEND_BASE_URL=https://ownapi.dev
      # Optional analytics (uncomment and fill when ready)
      # - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX
      # - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      # - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js

    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "tzTLoNHo3NGmstWtu4b5"]
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 7Ca0eeypsemSIFKYchpK
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network

volumes:
  pg_data:

networks:
  new-api-network:
    driver: bridge
